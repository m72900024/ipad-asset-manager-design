<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iPad 資產管理系統設計稿</title>
  <meta name="theme-color" content="#1f5eff">
  <link rel="preconnect" href="https://unpkg.com">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f9;
      --surface: #ffffff;
      --surface-soft: #f7faff;
      --line: #d8e1ec;
      --line-strong: #b8c6d8;
      --ink: #172033;
      --muted: #667386;
      --primary: #1f5eff;
      --primary-dark: #1647c7;
      --cyan: #00a7c8;
      --green: #19a974;
      --amber: #e59b17;
      --red: #df4d5f;
      --shadow: 0 18px 48px rgba(23, 32, 51, 0.12);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.58), rgba(255,255,255,0) 240px),
        radial-gradient(circle at 16% 10%, rgba(31, 94, 255, 0.14), transparent 28%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Microsoft JhengHei", sans-serif;
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .board {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 296px minmax(0, 1fr);
    }

    .rail {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px 18px;
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(20px);
      overflow-y: auto;
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 22px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      box-shadow: 0 12px 24px rgba(31, 94, 255, 0.24);
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
      font-weight: 900;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .section-label {
      margin: 20px 0 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .nav-list {
      display: grid;
      gap: 7px;
    }

    .nav-btn {
      width: 100%;
      min-height: 42px;
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      color: var(--muted);
      background: transparent;
      text-align: left;
      font-size: 14px;
      font-weight: 800;
    }

    .nav-btn:hover, .nav-btn.active {
      color: var(--primary-dark);
      border-color: rgba(31, 94, 255, 0.2);
      background: #eef5ff;
    }

    .token-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .swatch {
      height: 28px;
      border-radius: 7px;
      border: 1px solid rgba(23,32,51,0.1);
    }

    .content {
      min-width: 0;
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }

    .topbar h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 950;
    }

    .topbar p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .device-toggle {
      display: flex;
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.78);
    }

    .device-toggle button {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      min-height: 36px;
      padding: 0 12px;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      font-size: 13px;
      font-weight: 900;
    }

    .device-toggle button.active {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 10px 18px rgba(31,94,255,0.2);
    }

    .canvas {
      display: grid;
      gap: 18px;
      align-items: start;
    }

    .frame-shell {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.62);
      box-shadow: var(--shadow);
      overflow: auto;
    }

    .desktop-frame {
      width: 1440px;
      min-height: 900px;
      border: 1px solid #cbd7e6;
      border-radius: 12px;
      background: #f5f7fb;
      overflow: hidden;
      transform-origin: top left;
    }

    .ipad-frame {
      width: 1024px;
      min-height: 720px;
      border: 16px solid #202737;
      border-radius: 34px;
      background: #f5f7fb;
      overflow: hidden;
      transform-origin: top left;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .app-nav {
      height: 68px;
      display: grid;
      grid-template-columns: 300px 1fr 420px;
      align-items: center;
      gap: 18px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.9);
    }

    .crumbs, .userline {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .app-title {
      display: flex;
      justify-content: center;
      gap: 10px;
      align-items: center;
      font-size: 18px;
      font-weight: 950;
    }

    .userline { justify-content: flex-end; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 24px;
      padding: 0 9px;
      border-radius: 999px;
      background: #eef3fa;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .badge.primary { color: #fff; background: var(--primary); }
    .badge.green { color: #086943; background: #dff8ee; }
    .badge.amber { color: #8b5600; background: #fff1d4; }
    .badge.red { color: #9f2233; background: #ffe4e9; }
    .badge.cyan { color: #006176; background: #dbf8ff; }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #dbeafe, #a7f3d0);
      border: 2px solid #fff;
      box-shadow: 0 4px 12px rgba(23,32,51,0.15);
    }

    .workspace {
      width: min(100%, 1180px);
      margin: 0 auto;
      padding: 26px 0 38px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      padding: 6px;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .tab {
      min-height: 38px;
      padding: 0 18px;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      font-size: 14px;
      font-weight: 900;
    }

    .tab.active {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 10px 20px rgba(31,94,255,0.18);
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 14px 36px rgba(23,32,51,0.08);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      padding: 22px 24px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      margin: 0;
      font-size: 20px;
      font-weight: 950;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 7px;
      color: #fff;
      background: var(--primary);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .btn.secondary { color: var(--primary-dark); border-color: #bed1ff; background: #edf4ff; }
    .btn.green { background: var(--green); }
    .btn.cyan { background: var(--cyan); }
    .btn.amber { color: #392400; background: #f7b943; }
    .btn.red { background: var(--red); }
    .btn.ghost { color: var(--muted); border-color: var(--line); background: #fff; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 22px 24px 10px;
    }

    .stat {
      min-height: 104px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, #fff, #f8fbff);
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .stat strong {
      display: block;
      margin-top: 8px;
      font-size: 36px;
      line-height: 1;
      font-weight: 950;
    }

    .cart-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      padding: 14px 24px 24px;
    }

    .cart-card {
      min-height: 156px;
      padding: 18px;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .cart-card.alert { border-color: #f5c056; background: #fffbf0; }
    .cart-card.danger { border-color: #f1a4ae; background: #fff6f7; }

    .cart-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .cart-name {
      display: block;
      font-size: 20px;
      font-weight: 950;
    }

    .cart-meta {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .cart-location {
      display: flex;
      gap: 7px;
      align-items: center;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 850;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .layout-two {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 18px;
      padding: 24px;
    }

    .select-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .select-card label {
      display: block;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    select, input, textarea {
      width: 100%;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    textarea {
      min-height: 152px;
      padding: 12px;
      resize: none;
      line-height: 1.55;
    }

    .device-panel {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .device-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
    }

    .device-head strong {
      display: block;
      font-size: 22px;
    }

    .ipad-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 7px;
    }

    .ipad-chip {
      min-height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid #8fd8b7;
      border-radius: 7px;
      color: #096941;
      background: #e8fbf2;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px;
      font-weight: 950;
    }

    .ipad-chip.moved {
      color: #8a5600;
      border-color: #f0c15d;
      background: #fff2d3;
    }

    .ipad-chip.loaned {
      color: #9f2233;
      border-color: #f0a1ad;
      background: #ffe5ea;
    }

    .legend {
      display: flex;
      gap: 14px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      display: inline-block;
      margin-right: 5px;
      vertical-align: -1px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      padding: 12px 14px;
      color: var(--muted);
      background: #eef3fa;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 12px;
      font-weight: 950;
      white-space: nowrap;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid #edf1f6;
      color: #344054;
      vertical-align: middle;
    }

    tr.warn td { background: #fff9eb; }
    tr.hot td { background: #fff5f7; }

    .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 850; }
    .searchbar { padding: 0 24px 18px; }
    .table-wrap { padding: 0 24px 24px; overflow: hidden; }

    .log-list {
      display: grid;
      gap: 8px;
      padding: 0 24px 24px;
    }

    .log-row {
      display: grid;
      grid-template-columns: 138px 92px 128px 1fr 120px;
      gap: 12px;
      align-items: center;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      font-weight: 780;
    }

    .mdm-body {
      display: grid;
      grid-template-columns: 420px minmax(0, 1fr);
      gap: 18px;
      padding: 24px;
    }

    .mdm-input {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .mdm-results {
      display: grid;
      gap: 12px;
    }

    .mini-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .mini-stat {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .mini-stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .mini-stat strong {
      display: block;
      margin-top: 6px;
      font-size: 28px;
      font-weight: 950;
    }

    .modal-backdrop {
      position: absolute;
      inset: 68px 0 0;
      display: grid;
      place-items: center;
      background: rgba(23, 32, 51, 0.32);
    }

    .modal {
      width: 420px;
      padding: 22px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 26px 70px rgba(23,32,51,0.28);
    }

    .modal h3 {
      margin: 0 0 12px;
      font-size: 21px;
      font-weight: 950;
    }

    .modal p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
      font-weight: 700;
    }

    .home-grid {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 24px;
      padding: 48px;
    }

    .home-intro {
      min-height: 520px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, #fff 0%, #edf6ff 55%, #e9fbf7 100%);
    }

    .home-title {
      margin: 26px 0 14px;
      font-size: 62px;
      line-height: 0.98;
      letter-spacing: 0;
      font-weight: 950;
    }

    .home-sub {
      max-width: 460px;
      color: var(--muted);
      line-height: 1.8;
      font-weight: 760;
    }

    .entry-grid {
      display: grid;
      gap: 14px;
    }

    .entry-card {
      min-height: 162px;
      display: grid;
      grid-template-columns: 58px 1fr 28px;
      gap: 16px;
      align-items: center;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 14px 34px rgba(23,32,51,0.08);
    }

    .entry-icon {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      color: #fff;
      background: var(--primary);
    }

    .entry-card h3 {
      margin: 0;
      font-size: 22px;
      font-weight: 950;
    }

    .entry-card p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
      font-weight: 720;
    }

    .checksheet {
      width: 720px;
      margin: 28px auto;
      padding: 28px;
      border: 1px solid #999;
      background: #fff;
      color: #111;
      font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    .checksheet h2 {
      margin: 0 0 4px;
      text-align: center;
      font-size: 22px;
    }

    .checksheet .sub {
      margin-bottom: 14px;
      color: #555;
      text-align: center;
      font-size: 13px;
    }

    .goal {
      margin-bottom: 12px;
      padding: 8px 12px;
      border-left: 4px solid var(--primary);
      border-radius: 0 4px 4px 0;
      background: #f3f4f6;
      font-size: 13px;
    }

    .print-table th {
      color: #fff;
      background: var(--primary);
      border: 1px solid var(--primary);
    }

    .print-table td { border: 1px solid #bbb; }
    .box { display: inline-block; width: 15px; height: 15px; border: 1.6px solid #333; border-radius: 3px; }

    .ipad-frame .app-nav {
      height: 60px;
      grid-template-columns: 1fr auto;
      padding: 0 20px;
    }

    .ipad-frame .workspace {
      width: 100%;
      padding: 18px;
    }

    .ipad-frame .tabs {
      overflow: auto;
      white-space: nowrap;
    }

    .ipad-frame .tab {
      min-height: 44px;
      padding: 0 16px;
    }

    .ipad-frame .layout-two,
    .ipad-frame .mdm-body {
      grid-template-columns: 1fr;
      padding: 18px;
    }

    .ipad-frame .device-panel {
      min-height: 470px;
    }

    .ipad-frame .ipad-grid {
      grid-template-columns: repeat(7, 1fr);
      gap: 9px;
    }

    .ipad-frame .ipad-chip {
      min-height: 48px;
      font-size: 14px;
    }

    .ipad-frame .actions .btn {
      min-height: 44px;
      padding: 0 15px;
    }

    .ipad-frame .modal-backdrop { inset: 60px 0 0; }
    .ipad-frame .modal { width: 460px; }

    @media (max-width: 980px) {
      .board { grid-template-columns: 1fr; }
      .rail { position: static; height: auto; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .frame-shell { padding: 10px; }
    }
  </style>
</head>
<body>
  <main class="board">
    <aside class="rail">
      <div class="brand">
        <div class="brand-mark"><i data-lucide="tablet"></i></div>
        <div>
          <h1>iPad 資產管理</h1>
          <p>Figma-ready redesign board</p>
        </div>
      </div>

      <div class="section-label">Desktop frames</div>
      <div class="nav-list">
        <button class="nav-btn active" data-target="desktop-dashboard"><i data-lucide="layout-dashboard"></i><span>分佈概覽</span></button>
        <button class="nav-btn" data-target="desktop-carts"><i data-lucide="boxes"></i><span>充電車管理</span></button>
        <button class="nav-btn" data-target="desktop-edit"><i data-lucide="table-2"></i><span>數據編輯</span></button>
        <button class="nav-btn" data-target="desktop-mdm"><i data-lucide="search-check"></i><span>MDM 查詢</span></button>
        <button class="nav-btn" data-target="desktop-logs"><i data-lucide="history"></i><span>操作紀錄</span></button>
        <button class="nav-btn" data-target="desktop-home"><i data-lucide="home"></i><span>首頁入口</span></button>
        <button class="nav-btn" data-target="desktop-checklist"><i data-lucide="printer"></i><span>期末檢查單</span></button>
      </div>

      <div class="section-label">iPad frames</div>
      <div class="nav-list">
        <button class="nav-btn" data-target="ipad-cart"><i data-lucide="hand-pointer"></i><span>現場盤點</span></button>
        <button class="nav-btn" data-target="ipad-mdm"><i data-lucide="clipboard-search"></i><span>MDM 結果</span></button>
        <button class="nav-btn" data-target="ipad-modal"><i data-lucide="panel-top"></i><span>搬移操作</span></button>
      </div>

      <div class="section-label">Tokens</div>
      <div class="token-grid" aria-label="Color tokens">
        <span class="swatch" style="background:#1f5eff"></span>
        <span class="swatch" style="background:#00a7c8"></span>

  <script>
    const cartData = [
      ["充電車1", "410", 27, "ok"],
      ["充電車2", "604", 29, "moved"],
      ["充電車3", "603", 28, "ok"],
      ["充電車4", "408", 28, "loaned"],
      ["充電車5", "501", 31, "ok"],
      ["充電車6", "609", 30, "moved"],
      ["充電車7", "201", 28, "ok"],
      ["充電車8", "302", 28, "ok"],
      ["充電車9", "306", 29, "loaned"]

    function icon(name) {
      return `<i data-lucide="${name}" width="17" height="17"></i>`;
    }

    function nav(active = "dashboard", mode = "online") {
      const tabs = [
        ["dashboard", "分佈概覽"],
        ["carts", "充電車管理"],
        ["edit", "數據編輯"],
        ["logs", "操作紀錄"],
        ["mdm", "MDM 查詢"]
      ];
      return `
        <div class="app-nav">
          <div class="crumbs"><span>首頁</span><span>/</span><strong>${mode === "online" ? "線上版" : "離線版"}</strong></div>
          <div class="app-title">${icon("tablet")}<span>億載國小 iPad 資產管理</span></div>
          <div class="userline">
            <span class="avatar"></span>
            <span>王老師</span>
            <span class="badge primary">管理員</span>
            <span class="badge green">${mode === "online" ? "Firebase 線上模式" : "離線模式"}</span>
            <span class="badge">438 台 iPad</span>
          </div>
        </div>
        <div class="workspace">
          <div class="tabs">
            ${tabs.map(t => `<button class="tab ${t[0] === active ? "active" : ""}">${t[1]}</button>`).join("")}
          </div>
      `;
    }

    function endWorkspace() {
      return `</div>`;
    }

    function cartCard([name, room, count, state]) {
      const moved = state === "moved";
      const loaned = state === "loaned";
      return `
        <div class="cart-card ${loaned ? "danger" : moved ? "alert" : ""}">
          <div class="cart-top">
            <div><span class="cart-name">${name}</span><span class="cart-meta">充電車設備</span></div>
            <span class="badge primary">${count} 台</span>
          </div>
          <div class="cart-location">${icon("map-pin")}<span>${room}</span></div>
          <div class="chip-row">
            ${loaned ? `<span class="badge red">${icon("tag")}2 台外借</span>` : ""}
            ${moved ? `<span class="badge amber">${icon("truck")}3 台已搬移</span>` : ""}
            ${!loaned && !moved ? `<span class="badge green">${icon("circle-check")}全部在位</span>` : ""}
          </div>
        </div>
      `;
    }

    function dashboard() {
      return nav("dashboard") + `
        <div class="panel">
          <div class="panel-head">
            <h3 class="panel-title">充電車分佈概覽</h3>
            <div class="actions">
              <button class="btn secondary">${icon("rotate-ccw")}全部歸回創意教室</button>
              <button class="btn green">${icon("plus")}新增設備</button>
              <button class="btn cyan">${icon("download")}匯出 CSV</button>
            </div>
          </div>
          <div class="stats-grid">
            <div class="stat"><span>總設備數</span><strong style="color:var(--primary)">438</strong></div>
            <div class="stat"><span>充電車數</span><strong style="color:var(--green)">17</strong></div>
            <div class="stat"><span>已搬移</span><strong style="color:var(--amber)">6</strong></div>
            <div class="stat"><span>外借中</span><strong style="color:var(--red)">4</strong></div>
          </div>
          <div class="cart-grid">${cartData.map(cartCard).join("")}</div>
        </div>
      ` + endWorkspace();
    }

    function deviceGrid(count = 30) {
      return Array.from({ length: count }, (_, i) => {
        const n = String(i + 141).padStart(3, "0");
        const cls = i === 4 || i === 18 ? "moved" : i === 11 ? "loaned" : "";
        return `<span class="ipad-chip ${cls}">${n}</span>`;
      }).join("");
    }

    function carts() {
      return nav("carts") + `
        <div class="panel">
          <div class="panel-head"><h3 class="panel-title">充電車管理</h3><div class="actions"><button class="btn cyan">${icon("truck")}整車搬移</button></div></div>
          <div class="layout-two">
            <div class="select-card">
              <label>選擇充電車</label>
              <select><option>充電車6（30 台）</option></select>
              <div style="height:14px"></div>
              <div class="mini-stats">
                <div class="mini-stat"><span>在位</span><strong style="color:var(--green)">27</strong></div>
                <div class="mini-stat"><span>搬移</span><strong style="color:var(--amber)">2</strong></div>
                <div class="mini-stat"><span>外借</span><strong style="color:var(--red)">1</strong></div>
              </div>
            </div>
            <div class="device-panel">
              <div class="device-head">
                <div><strong>充電車6</strong><span class="cart-meta">30 台 | 位置 609、創意教室</span></div>
                <button class="btn cyan">${icon("truck")}整車搬移</button>
              </div>
              <div class="ipad-grid">${deviceGrid(30)}</div>
              <div class="legend"><span><i class="dot" style="background:#e8fbf2;border:1px solid #8fd8b7"></i>在位</span><span><i class="dot" style="background:#fff2d3;border:1px solid #f0c15d"></i>已搬移</span><span><i class="dot" style="background:#ffe5ea;border:1px solid #f0a1ad"></i>外借中</span></div>
            </div>
          </div>
        </div>
      ` + endWorkspace();
    }

    function edit() {
      const rows = [
        ["YZES_IPAD9_141", "充電車6", "609", "", ""],
        ["YZES_IPAD9_142", "充電車6", "609", "", ""],
        ["YZES_IPAD9_143", "充電車6", "創意教室", "", "warn"],
        ["YZES_IPAD9_144", "充電車6", "609", "六年二班", "hot"],
        ["YZES_IPAD9_145", "充電車6", "609", "", ""],
        ["YZES_IPAD9_146", "充電車6", "自然教室", "", "warn"]
      ];
      return nav("edit") + `
        <div class="panel">
          <div class="panel-head">
            <h3 class="panel-title">數據編輯</h3>
            <div class="actions"><button class="btn green">${icon("plus")}新增設備</button><button class="btn cyan">${icon("download")}匯出 CSV</button><button class="btn amber">${icon("upload")}匯入 CSV</button></div>
          </div>
          <div class="searchbar"><input value="" placeholder="搜尋設備編號、位置、外借..." /></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>#</th><th>設備編號</th><th>所屬充電車</th><th>目前位置</th><th>外借</th><th>操作</th></tr></thead>
              <tbody>${rows.map((r, i) => `<tr class="${r[4]}"><td>${i + 1}</td><td class="mono">${r[0]}</td><td><strong style="color:var(--primary)">${r[1]}</strong></td><td>${r[2]}</td><td>${r[3] ? `<span class="badge red">${r[3]}</span>` : "-"}</td><td><div class="actions"><button class="btn cyan">搬移</button><button class="btn amber">${r[3] ? "歸還" : "外借"}</button><button class="btn secondary">改名</button><button class="btn red">刪除</button></div></td></tr>`).join("")}</tbody>
            </table>
          </div>
        </div>
      ` + endWorkspace();
    }

    function mdm() {
      return nav("mdm") + `
        <div class="panel">
          <div class="panel-head"><h3 class="panel-title">MDM 未使用載具查詢</h3><div class="actions"><button class="btn">${icon("search-check")}查詢比對</button><button class="btn ghost">${icon("copy")}複製結果</button><button class="btn ghost">${icon("printer")}列印</button></div></div>
          <div class="mdm-body">
            <div class="mdm-input">
              <label style="display:block;margin-bottom:8px;color:var(--muted);font-weight:900;font-size:12px">貼上 MDM 清單</label>
              <textarea>YZES_IPAD9_141    2026/3/5 上午 09:33:00
YZES_IPAD9_144    2026/2/24 下午 08:02:03
YZES_IPAD9_310    2026/2/21 上午 11:18:42</textarea>
            </div>
            <div class="mdm-results">
              <div class="mini-stats"><div class="mini-stat"><span>總筆數</span><strong style="color:var(--cyan)">24</strong></div><div class="mini-stat"><span>已找到</span><strong style="color:var(--green)">22</strong></div><div class="mini-stat"><span>查無</span><strong style="color:var(--red)">2</strong></div></div>
              <div class="panel" style="box-shadow:none">
                <div class="table-wrap" style="padding:0">
                  <table><thead><tr><th>#</th><th>名稱</th><th>同步時間</th><th>充電車</th><th>位置</th><th>狀態</th></tr></thead>
                  <tbody>
                    <tr><td>1</td><td class="mono">YZES_IPAD9_141</td><td>2026/3/5 09:33</td><td>充電車6</td><td>609</td><td><span class="badge green">已找到</span></td></tr>
                    <tr><td>2</td><td class="mono">YZES_IPAD9_144</td><td>2026/2/24 20:02</td><td>充電車6</td><td>609</td><td><span class="badge green">已找到</span></td></tr>
                    <tr class="hot"><td>3</td><td class="mono">YZES_IPAD9_999</td><td>2026/2/21 11:18</td><td>-</td><td>-</td><td><span class="badge red">查無</span></td></tr>
                  </tbody></table>
                </div>
              </div>
            </div>
          </div>
        </div>
      ` + endWorkspace();
    }

    function logs() {
      const logs = [
        ["2026/06/25 14:21", "搬移", "YZES_IPAD9_143", "609 -> 創意教室", "王老師"],
        ["2026/06/25 14:18", "外借", "YZES_IPAD9_144", "借給 六年二班", "王老師"],
        ["2026/06/25 13:52", "整車搬移", "充電車6", "30 台 -> 609", "管理員"],
        ["2026/06/25 13:10", "匯入", "", "CSV 匯入 438 筆", "管理員"]
      ];
      return nav("logs") + `
        <div class="panel">
          <div class="panel-head"><h3 class="panel-title">操作紀錄</h3><div class="actions"><button class="btn cyan">${icon("download")}匯出紀錄</button></div></div>
          <div class="searchbar"><input placeholder="搜尋紀錄..." /></div>
          <div class="log-list">${logs.map(l => `<div class="log-row"><span>${l[0]}</span><span class="badge ${l[1] === "外借" ? "amber" : l[1] === "搬移" ? "cyan" : "green"}">${l[1]}</span><span class="mono">${l[2]}</span><span>${l[3]}</span><span>${l[4]}</span></div>`).join("")}</div>
        </div>
      ` + endWorkspace();
    }

    function home() {
      return `
        <div class="home-grid">
          <section class="home-intro">
            <div>
              <div class="brand-mark" style="width:128px;height:64px;font-size:24px;font-weight:950">億載國小</div>
              <h2 class="home-title">iPad 資產<br>管理系統</h2>
              <p class="home-sub">給學校日常盤點、充電車搬移、MDM 查詢和期末檢查使用的輕量工作台。</p>
            </div>
            <div class="mini-stats"><div class="mini-stat"><span>雲端</span><strong>同步</strong></div><div class="mini-stat"><span>離線</span><strong>可用</strong></div><div class="mini-stat"><span>A4</span><strong>盤點</strong></div></div>
          </section>
          <section class="entry-grid">
            <div class="entry-card"><div class="entry-icon">${icon("cloud-check")}</div><div><h3>線上版</h3><p>Firebase 雲端同步，適合日常更新、外借登記和多人查詢。</p></div>${icon("chevron-right")}</div>
            <div class="entry-card"><div class="entry-icon" style="background:var(--green)">${icon("hard-drive")}</div><div><h3>離線版</h3><p>內建資料，可匯入匯出 CSV，沒有網路也能完成盤點。</p></div>${icon("chevron-right")}</div>
            <div class="entry-card"><div class="entry-icon" style="background:var(--cyan)">${icon("clipboard-check")}</div><div><h3>期末檢查單</h3><p>選擇充電車後自動產生可列印的 A4 盤點表。</p></div>${icon("chevron-right")}</div>
          </section>
        </div>
      `;
    }

    function checklist() {
      const rows = Array.from({ length: 14 }, (_, i) => `<tr><td>${i + 1}</td><td class="mono">YZES_IPAD9_${String(i + 141).padStart(3, "0")}</td><td><span class="box"></span></td><td><span class="box"></span></td><td></td></tr>`).join("");
      return `
        <div style="height:64px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid var(--line);background:#fff"><button class="btn ghost">${icon("arrow-left")}首頁</button><select style="width:180px"><option>充電車6</option></select><input style="width:220px" value="114 學年度第 2 學期"><button class="btn">產生檢查單</button><button class="btn ghost">${icon("printer")}列印 / 存 PDF</button></div>
        <div class="checksheet">
          <h2>iPad 充電車 · 期末檢查單</h2>
          <div class="sub">億載國小 | 114 學年度第 2 學期 期末設備盤點</div>
          <div class="goal"><strong>檢查目標：</strong>確認本車 iPad 數量齊全、外觀無重大破損、可正常開機使用，充電線/變壓器與鑰匙完整。</div>
          <table><tbody><tr><td><strong>充電車</strong></td><td>充電車6</td><td><strong>應有總台數</strong></td><td>30 台</td></tr><tr><td><strong>存放位置</strong></td><td>609</td><td><strong>鑰匙</strong></td><td><span class="box"></span> 在　<span class="box"></span> 不在</td></tr></tbody></table>
          <div style="height:12px"></div>
          <table class="print-table"><thead><tr><th>#</th><th>平板編號</th><th>在位</th><th>充電線/變壓器</th><th>備註</th></tr></thead><tbody>${rows}</tbody></table>
        </div>
      `;
    }

    function ipadCart() {
      return nav("carts", "offline") + `
        <div class="panel">
          <div class="layout-two">
            <div class="device-panel">
              <div class="device-head">
                <div><strong>充電車6</strong><span class="cart-meta">30 台 | 位置 609、創意教室</span></div>
                <div class="actions"><button class="btn cyan">${icon("truck")}整車搬移</button><button class="btn green">${icon("plus")}新增</button></div>
              </div>
              <div class="ipad-grid">${deviceGrid(30)}</div>
              <div class="legend"><span><i class="dot" style="background:#e8fbf2;border:1px solid #8fd8b7"></i>在位</span><span><i class="dot" style="background:#fff2d3;border:1px solid #f0c15d"></i>已搬移</span><span><i class="dot" style="background:#ffe5ea;border:1px solid #f0a1ad"></i>外借中</span></div>
            </div>
          </div>
        </div>
      ` + endWorkspace();
    }

    function ipadMdm() {
      return nav("mdm", "offline") + `
        <div class="panel">
          <div class="panel-head"><h3 class="panel-title">MDM 未使用載具查詢</h3><div class="actions"><button class="btn">${icon("search-check")}查詢</button><button class="btn ghost">${icon("copy")}複製</button></div></div>
          <div class="mdm-body">
            <div class="mini-stats"><div class="mini-stat"><span>總筆數</span><strong style="color:var(--cyan)">24</strong></div><div class="mini-stat"><span>已找到</span><strong style="color:var(--green)">22</strong></div><div class="mini-stat"><span>查無</span><strong style="color:var(--red)">2</strong></div></div>
            <div class="cart-grid" style="grid-template-columns:repeat(2,1fr);padding:0">${cartData.slice(0,4).map(cartCard).join("")}</div>
          </div>
        </div>
      ` + endWorkspace();
    }

    function ipadModal() {
      return ipadCart() + `
        <div class="modal-backdrop">
          <div class="modal">
            <h3>搬移 YZES_IPAD9_143</h3>
            <p>目前位置：609。請輸入這台 iPad 的目標位置，送出後會寫入操作紀錄。</p>
            <label style="display:block;margin-bottom:8px;color:var(--muted);font-weight:900;font-size:12px">目標位置</label>
            <input value="創意教室">
            <div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn ghost">取消</button><button class="btn cyan">${icon("truck")}確認搬移</button></div>
          </div>
        </div>
      `;
    }

    document.getElementById("desktop-dashboard").innerHTML = dashboard();
    document.getElementById("desktop-carts").innerHTML = carts();
    document.getElementById("desktop-edit").innerHTML = edit();
    document.getElementById("desktop-mdm").innerHTML = mdm();
    document.getElementById("desktop-logs").innerHTML = logs();
    document.getElementById("desktop-home").innerHTML = home();
    document.getElementById("desktop-checklist").innerHTML = checklist();
    document.getElementById("ipad-cart").innerHTML = ipadCart();
    document.getElementById("ipad-mdm").innerHTML = ipadMdm();
    document.getElementById("ipad-modal").innerHTML = ipadModal();

    const navButtons = [...document.querySelectorAll(".nav-btn")];
    const deviceButtons = [...document.querySelectorAll(".device-toggle button")];
    let activeTarget = "desktop-dashboard";

    function updateFrame(target) {
      activeTarget = target;
      const isIpad = target.startsWith("ipad-");
      document.getElementById("desktop-shell").style.display = isIpad ? "none" : "block";
      document.getElementById("ipad-shell").style.display = isIpad ? "block" : "none";
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      const screen = document.getElementById(target);
      screen.classList.add("active");
      document.getElementById("frame-title").textContent = screen.dataset.title;
      document.getElementById("frame-subtitle").textContent = screen.dataset.subtitle;
      navButtons.forEach(btn => btn.classList.toggle("active", btn.dataset.target === target));
      deviceButtons.forEach(btn => btn.classList.toggle("active", btn.dataset.device === (isIpad ? "ipad" : "desktop")));
      if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 2.2 } });
    }

    navButtons.forEach(btn => btn.addEventListener("click", () => updateFrame(btn.dataset.target)));
    deviceButtons.forEach(btn => btn.addEventListener("click", () => {
      if (btn.dataset.device === "desktop") updateFrame("desktop-dashboard");
      else updateFrame("ipad-cart");
    }));

    updateFrame(activeTarget);
  </script>
</body>
</html>
